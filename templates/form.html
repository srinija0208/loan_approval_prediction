<html>
<body>
<form action="{{url_for('predict_datapoint')}}" method="POST">
    <div class="form-group">
        <label for="Gender">Gender:</label>
        <select id="Gender" name="Gender">
            <option value="Female">Female</option>
            <option value="Male">Male</option>
        </select>
    </div>
    <br>
    <div class="form-group">
        <label for="Married">Married:</label>
        <select id="Married" name="Married">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>
    <br>
    <div class="form-group">  
        <label for="Dependents">Dependents:</label>
        <select id="Dependents" name="Dependents">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3+">3+</option>
        </select>
    </div>
    <br>
    <div class="form-group">
        <label for="Education">Education:</label>
        <select id="Education" name="Education">
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
        </select>
    </div>
    <br>
    <div class="form-group">
        <label for="Self_Employed">Self_Employed:</label>
        <select id="Self_Employed" name="Self_Employed">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>
    <br>
    <div class="form-group">
        <label for="ApplicantIncome">ApplicantIncome:</label>
        <input type="text" id="ApplicantIncome" name="ApplicantIncome" placeholder="Enter ApplicantIncome(int)">
    </div> 
    <br>
    <div class="form-group">
        <label for="CoapplicantIncome">CoapplicantIncome:</label>
        <input type="text" id="CoapplicantIncome" name="CoapplicantIncome" placeholder="Enter CoapplicantIncome(float)">
    </div> 
    <br>
    <div class="form-group">
        <label for="LoanAmount">LoanAmount:</label>
        <input type="text" id="LoanAmount" name="LoanAmount" placeholder="Enter LoanAmount(float)">
    </div> 
    <br>
    <div class="form-group">
        <label for="Loan_Amount_Term">Loan_Amount_Term:</label>
        <input type="text" id="Loan_Amount_Term" name="Loan_Amount_Term" placeholder="Enter Loan_Amount_Term(float)">
    </div>   
    <br>
    <div class="form-group">
        <label for="Credit_History">Credit_History:</label>
        <select id="Credit_History" name="Credit_History">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>
    </div>  
    <br>
    <div class="form-group">
        <label for="Property_Area">Property_Area:</label>
        <select id="Property_Area" name="Property_Area">
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
            <option value="Semiurban">Semiurban</option>
        </select>
    </div>  
<br>
<div style="clear:both;"></div>
  <input type="submit" value="Submit">
</form>
</body>
</html>
